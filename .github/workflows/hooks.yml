name: hooks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: 文档一致性 / 门禁 / 校验器 / 导出契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest python-docx
      - run: pytest hook -q

  blueprint-full:
    name: 蓝图契约（需要 spaCy 模型，失败不阻塞但要看）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 全量运行：spaCy 跑词表/生词判定契约，python-docx 跑导出契约，mcp 跑 vocab-checker 工具层契约
      - run: pip install pytest python-docx "spacy>=3.8" "mcp>=1.10"
      - run: python -m spacy download en_core_web_sm
      - run: pytest hook -q
